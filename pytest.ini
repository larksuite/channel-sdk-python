[pytest]
asyncio_mode = auto
testpaths =
    lark_channel/channel/tests
    lark_channel/channel/meeting/tests
    lark_channel/core/cache/tests
    lark_channel/core/token/tests
    lark_channel/event/tests
    lark_channel/ws/tests
    tests
python_files = test_*.py
# Targeted warning filter: FileTokenStore warns loudly on construction; tests
# that exercise it would otherwise be noisy. We do not blanket-ignore
# DeprecationWarning here — that would hide real forward-compatibility
# regressions (e.g. asyncio.get_event_loop() being removed in 3.14).
filterwarnings =
    ignore:FileTokenStore is not for production:UserWarning
    # A dropped coroutine is a bug, not a warning: it means work that was
    # supposed to happen silently did not. This exact class hid a swallowed
    # error report through a full green suite.
    #
    # Both lines are needed. The RuntimeWarning is raised from the coroutine's
    # __del__, so turning it into an exception cannot propagate — CPython prints
    # "Exception ignored in:" and pytest re-packages it as an unraisable-
    # exception warning. Only the second line turns that into a failure. Checked
    # by deliberately dropping a coroutine and confirming the run goes red.
    error:coroutine .* was never awaited:RuntimeWarning
    error::pytest.PytestUnraisableExceptionWarning
markers =
    slow: marks tests that take non-trivial wall-clock time
